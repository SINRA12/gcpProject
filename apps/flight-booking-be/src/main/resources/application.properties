spring.application.name=flight-booking-be

# The service answers under /flight/booking, the same path the ingress routes. HAProxy and
# ingress-nginx do not rewrite paths, so the app has to serve the prefix itself.
server.port=8080
server.servlet.context-path=/flight/booking

# On shutdown, finish requests already in flight instead of cutting them: fewer errors during a rollout
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Health probes and metrics live on a separate port, so they are never reachable through the ingress
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Shown by GET /flight/booking/. The image sets APP_VERSION to its tag.
app.version=${APP_VERSION:dev}

# Demo knobs, set per environment from the Helm values (BOOKING_FAILURE_RATE, ...):
#   failure-rate  share of bookings that fail with HTTP 500
#   decline-rate  share of bookings the payment step declines (HTTP 402)
#   latency-ms    extra time added to every booking
booking.failure-rate=0.0
booking.decline-rate=0.05
booking.latency-ms=0

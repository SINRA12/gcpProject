# Build or destroy the lab from the GitHub Actions tab (Run workflow button).
# Also destroys the lab every night as a safety net against forgotten resources.
name: Lab

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [up, down, plan, status]
        default: plan
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC daily: auto "down" (change or remove to suit you)

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACTION: ${{ github.event.inputs.action || 'down' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      LAB_MY_IPS: ${{ vars.LAB_MY_IPS }}
      ENABLE_CLOUDFLARE: ${{ vars.ENABLE_CLOUDFLARE }}
      CF_DOMAIN: ${{ vars.CF_DOMAIN }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Write lab.tfvars from repository variables
        run: ./scripts/ci-write-tfvars.sh

      - name: lab.sh ${{ env.ACTION }}
        run: ./lab.sh "$ACTION"

# Runs on every pull request and every push to main.
#  - check: fmt, validate and a security scan (no cloud access needed)
#  - plan:  terraform plan against the real project, shown in the job summary
#           (runs only once the GCP_* repository variables are set)
name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Format and validate
        run: ./lab.sh check

      - name: Security scan (report only)
        run: pipx run checkov -d . --framework terraform --compact --quiet --soft-fail

  plan:
    needs: check
    if: ${{ vars.GCP_WIF_PROVIDER != '' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for GCP
    concurrency:
      group: terraform-lab
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      LAB_MY_IPS: ${{ vars.LAB_MY_IPS }}
      ENABLE_CLOUDFLARE: ${{ vars.ENABLE_CLOUDFLARE }}
      CF_DOMAIN: ${{ vars.CF_DOMAIN }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Write lab.tfvars from repository variables
        run: ./scripts/ci-write-tfvars.sh

      - name: Terraform plan
        run: |
          set -o pipefail
          ./lab.sh plan | tee plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            grep -E '^(===|Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
